; Example: mid-size yard with smaller cranes, cells and transporters (example values).
; Only keys that differ from the built-in defaults are listed; see large_yard.ini for all keys.

[yard]
name = generic mid-size yard (example values)

[weight]
rigging_weight = 5

[division]
max_ring_length = 20
side_split_z = 10.0          ; paint cells are too low for full-height side blocks
long_seams_y = 10.5          ; panel line / doors too narrow for 19.6 m-wide DB and deck blocks
deck_zone_depth = 5.0        ; keeps bulkhead blocks under the 14 m curved-shop height

[cutting]
max_stiffener_length = 16

[panel_line]
max_length = 18
max_width = 16
max_weight = 60

[curved_shop]
max_length = 18
max_width = 18
max_height = 14

[medium_assembly]
max_length = 18
max_width = 9
crane_capacity = 30

[assembly]
crane_capacity = 120
tandem_capacity = 200
max_length = 20
max_width = 20
max_height = 16
door_width = 20
door_height = 16

[turnover]
capacity = 160

[painting]
cell_length = 22
cell_width = 20
cell_height = 16
max_weight = 250
cells = 4

[transporter]
unit_capacity = 150
units = 2
route_height = 18
route_width = 22

[erection]
crane_capacity = 450
