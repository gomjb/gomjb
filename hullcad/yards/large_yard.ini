; hullcad shipyard profile. Lengths in m, weights in t. Unlisted keys keep their defaults.

[yard]  ; 야드 이름
name = generic large yard (example values) ; 프로파일 이름

[weight]  ; 중량 여유: 강재 여유, 선행의장 중량, 리깅 중량
steel_margin = 0.03                ; 강재 중량 여유 (용접, 압연 공차)
outfit_ratio = 0.05                ; 선행의장 중량 / 강재 중량
rigging_weight = 8                 ; 크레인 인양 시 더하는 리깅 중량 [t]

[division]  ; 분할 형상 규칙: 링 길이, 버트·심 이격, 존 높이
min_ring_length = 6                ; 링 최소 길이 [m]
max_ring_length = 30               ; 링 최대 길이 [m]
min_butt_clearance = 0.3           ; 버트와 횡부재(격벽, 웹) 최소 이격 [m]
seam_offset = 0.3                  ; 심과 종부재 이격 [m]
deck_zone_depth = 3                ; 데크 블록 높이 (상갑판 아래) [m]
end_split_z = 10                   ; 선수미부 상·하 블록 분할 높이 [m]
long_seams_y =                     ; 추가 종방향 심 위치 (좌현 기준, 우현 대칭, 쉼표 구분; 거더와 이격) [m]
side_split_z = 0                   ; 화물구역 사이드 블록 상·하 분할 높이 (0 = 분할 안 함, 스트링거와 이격) [m]

[cutting]  ; 절단/강재: 론지 연속성(블록 안 보강재 버트 금지), 강판 규격
enabled = true                     ; 절단/강재 검사 사용
continuous_longitudinals = true    ; 블록 안 론지 버트 금지 (블록 길이 <= 보강재 길이)
max_stiffener_length = 25          ; 보강재(론지) 최대 길이 [m]
max_plate_length = 21              ; 강판 최대 길이 (판 버트 수 산출용) [m]
max_plate_width = 4.5              ; 강판 최대 폭 (판 심 수 산출용) [m]

[panel_line]  ; 판넬라인(평블록): 주판넬과 격벽 판넬의 크기·중량
enabled = true                     ; 판넬라인 검사 사용
max_length = 25                    ; 판넬 최대 길이 [m]
max_width = 22                     ; 판넬 최대 폭 [m]
max_weight = 150                   ; 격벽 판넬 최대 중량 (0 = 무제한) [t]

[curved_shop]  ; 곡블록 공장: 곡블록 크기(핀지그 영역)
enabled = true                     ; 곡블록 공장 검사 사용
max_length = 26                    ; 곡블록 최대 길이 [m]
max_width = 24                     ; 곡블록 최대 폭 [m]
max_height = 24                    ; 곡블록 최대 높이 [m]
crane_capacity = 0                 ; 곡블록 공장 크레인 (0 = 검사 안 함) [t]

[medium_assembly]  ; 중조립: 웹·플로어 서브유닛 크기와 크레인
enabled = true                     ; 중조립 검사 사용
max_length = 22                    ; 웹·플로어 서브유닛 최대 길이 [m]
max_width = 10                     ; 웹·플로어 서브유닛 최대 폭 [m]
crane_capacity = 50                ; 중조립 크레인 [t]

[assembly]  ; 대조립 공장: 크레인(단독/텐덤), 정반·베이 크기, 출입문
enabled = true                     ; 대조립 공장 검사 사용
crane_capacity = 300               ; 천장 크레인 단독 능력 [t]
tandem_capacity = 500              ; 텐덤(2대) 인양 능력 (0 = 텐덤 불가) [t]
max_length = 30                    ; 정반/베이 최대 길이 [m]
max_width = 26                     ; 정반/베이 최대 폭 [m]
max_height = 24                    ; 크레인 훅 아래 최대 높이 [m]
door_width = 26                    ; 출입문 폭 (블록은 길이 방향으로 나감) [m]
door_height = 24                   ; 출입문 높이 [m]

[turnover]  ; 반전: 뒤집어 제작하는 블록(DB, 데크 등)의 반전 능력
enabled = true                     ; 반전 검사 사용
capacity = 400                     ; 반전 능력 [t]
zones = DB,DECK                    ; 뒤집어 제작하는 존 이름 접두어 (쉼표 구분)

[painting]  ; 도장 공장: 셀 크기, 바닥 하중
enabled = true                     ; 도장 공장 검사 사용
cell_length = 30                   ; 도장 셀 길이 [m]
cell_width = 26                    ; 도장 셀 폭 [m]
cell_height = 22                   ; 도장 셀 높이 [m]
max_weight = 600                   ; 도장 셀 최대 블록 중량 [t]
cells = 8                          ; 셀 수 (참고값, 일정 계획용) [ea]

[transporter]  ; 트랜스포터: 대당 능력, 동시 투입 대수, 운반 경로 클리어런스
enabled = true                     ; 트랜스포터 검사 사용
unit_capacity = 300                ; 대당 적재 능력 [t]
units = 2                          ; 한 블록에 동시 투입 가능한 대수 [ea]
multi_efficiency = 0.9             ; 다대 동기 운반 시 능력 계수
deck_height = 1.9                  ; 적재 데크 높이 [m]
route_height = 25                  ; 운반 경로 최소 높이 클리어런스 [m]
route_width = 30                   ; 운반 경로 최소 폭 [m]

[erection]  ; 탑재: 도크/골리앗 크레인 능력
enabled = true                     ; 탑재 크레인 검사 사용
crane_capacity = 900               ; 도크/골리앗 크레인 능력 [t]
tandem_capacity = 0                ; 텐덤 탑재 능력 (0 = 불가) [t]

[takeoff]  ; 물량 산출 가정: 웹 개구부, 슬롯, 보강재 도장 면적, 곡가공 선상가열 밀도 (참고값)
hole_area = 0.5                    ; 웹 개구부 1개 면적 [m2]
hole_perimeter = 2.7               ; 웹 개구부 1개 절단 길이 [m]
slot_length = 0.9                  ; 론지 관통 슬롯 1개 절단 길이 [m]
stiffener_paint_girth = 0.7        ; 보강재 1 m당 도장 면적 [m2/m]
heating_line_density = 1.5         ; 곡외판 1 m2당 선상가열 길이 [m/m2]

[util_cutting]  ; 유틸리티 원단위 - 절단: 플라즈마 전력·공기, 가스절단 산소·연료 (참고값)
plasma_max_thickness = 30          ; 플라즈마 절단 최대 두께 (초과 시 가스절단) [mm]
plasma_kwh_per_m = 0.35            ; 플라즈마 전력 [kWh/m]
plasma_air_nm3_per_m = 0.12        ; 플라즈마 압축공기 [Nm3/m]
oxy_o2_nm3_per_m = 0.2             ; 가스절단 산소 [Nm3/m]
oxy_fuel_nm3_per_m = 0.03          ; 가스절단 연료가스 (LNG/LPG) [Nm3/m]

[util_welding]  ; 유틸리티 원단위 - 용접: 용착량, 전력, CO2 보호가스, 가우징 공기 (참고값)
fillet_deposit = 0.16              ; 필릿 용착량 (한쪽, 각장 약 6 mm) [kg/m]
shop_butt_deposit = 1.8            ; 공장 맞대기 용접 용착량 [kg/m]
erection_butt_deposit = 2.2        ; 탑재 맞대기 용접 용착량 [kg/m]
saw_on_flat_blocks = true          ; 평블록 판 이음은 SAW(판넬라인)로 용접
fcaw_kwh_per_kg = 4                ; FCAW 전력 (용착금속 1 kg당) [kWh/kg]
fcaw_co2_nm3_per_kg = 0.4          ; FCAW CO2 보호가스 [Nm3/kg]
saw_kwh_per_kg = 2.2               ; SAW 전력 [kWh/kg]
gouging_air_nm3_per_m = 1.5        ; 맞대기 용접 가우징·그라인딩 압축공기 [Nm3/m]

[util_heating]  ; 유틸리티 원단위 - 곡가공 선상가열: 연료가스, 산소, 냉각수 (참고값)
fuel_nm3_per_m = 0.03              ; 선상가열 연료가스 [Nm3/m]
o2_nm3_per_m = 0.08                ; 선상가열 산소 [Nm3/m]
water_m3_per_m = 0.01              ; 선상가열 냉각수 [m3/m]

[util_painting]  ; 유틸리티 원단위 - 블라스팅·도장: 도장 횟수, 압축공기, 도료, 환기 전력, 건조 연료 (참고값)
coats = 3                          ; 도장 횟수 [회]
blast_fraction = 1                 ; 블록 단계 블라스팅 비율 (도장 면적 대비)
blast_air_nm3_per_m2 = 25          ; 블라스팅 압축공기 [Nm3/m2]
spray_air_nm3_per_m2_coat = 1.5    ; 도장 스프레이 압축공기 (1회당) [Nm3/m2]
paint_l_per_m2_coat = 0.25         ; 도료 사용량 (1회당) [L/m2]
ventilation_kwh_per_m2 = 1.5       ; 도장 셀 환기·제습·조명 전력 [kWh/m2]
drying_fuel_nm3_per_m2 = 0.05      ; 건조 연료가스 [Nm3/m2]

[util_handling]  ; 유틸리티 원단위 - 크레인 전력, 트랜스포터 경유 (참고값)
lifts_per_block = 4                ; 블록당 크레인 인양 횟수 [회]
lift_height = 25                   ; 평균 인양 높이 [m]
crane_efficiency = 0.5             ; 크레인 효율 (전력→위치에너지)
transport_moves = 3                ; 블록당 트랜스포터 이동 횟수 [회]
transport_km_per_move = 1.5        ; 이동 1회 평균 거리 [km]
diesel_l_per_tkm = 0.05            ; 트랜스포터 경유 [L/t·km]

[util_testing]  ; 유틸리티 원단위 - 탱크 수압·공기 시험 (참고값)
water_test_fraction = 0.5          ; 수압 시험하는 탱크 용적 비율
air_test_fraction = 0.5            ; 공기 시험하는 탱크 용적 비율
air_test_pressure_bar = 0.2        ; 공기 시험 압력 (게이지) [bar]
air_leak_factor = 2                ; 공기 시험 손실·재시험 계수

[schedule]  ; 생산 일정: 탑재 시작일·속도·순서, 공정별 기간(작업일) (예시값)
erection_start = 2027-03-02        ; 첫 블록 탑재일 (YYYY-MM-DD)
work_days_per_week = 6             ; 주당 작업일 (월요일부터) [일]
erection_blocks_per_day = 1.5      ; 탑재 속도 [블록/일]
erection_key_x = 0.35              ; 탑재 시작 위치 (키 블록 링) [x/Lpp]
cutting_days = 4                   ; 절단 기간 [일]
heating_days = 5                   ; 곡가공 기간 (곡블록만) [일]
assembly_days = 8                  ; 조립 기본 기간 [일]
assembly_days_per_100t = 4         ; 강재 100 t당 추가 조립 기간 [일]
painting_days = 6                  ; 블라스팅·도장 기간 [일]
paint_to_erection_days = 5         ; 도장 완료 후 탑재까지 (적치·선행탑재) [일]
erection_weld_days = 6             ; 탑재 후 용접 기간 [일]
test_after_last_erection_days = 20 ; 마지막 탑재 후 탱크 시험 시작까지 [일]
test_days = 30                     ; 탱크 시험 기간 [일]

[capacity]  ; 유틸리티 공급 능력(이 호선 할당분, 0 = 검사 안 함), 시간당 환산, 기본 부하
hours_per_day = 16                 ; 하루 작업 시간 (일 사용량을 시간당으로 환산) [h]
peak_factor = 1.3                  ; 동시 사용 계수 (피크 / 평균 시간당 수요)
electricity_kw = 0                 ; 전력 공급 능력 [kW]
oxygen_nm3_h = 0                   ; 산소 공급 능력 [Nm3/h]
fuel_gas_nm3_h = 0                 ; 연료가스 공급 능력 [Nm3/h]
co2_nm3_h = 0                      ; CO2 공급 능력 [Nm3/h]
air_nm3_min = 0                    ; 압축공기 공급 능력 (컴프레서) [Nm3/min]
water_m3_h = 0                     ; 용수 공급 능력 [m3/h]
base_electricity_kw = 0            ; 기본 전력 부하 (조명·공조, 작업 시간 중) [kW]
base_air_nm3_min = 0               ; 기본 공기 부하 (공회전·누설) [Nm3/min]
